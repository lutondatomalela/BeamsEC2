name: Validation
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python selftest.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q beams_ec2 tests
      - name: Windows Tk calculation and exports
        if: runner.os == 'Windows'
        env:
          BEAMSEC2_GUI_TESTS: '1'
        run: python -m unittest discover -s tests -p test_windows_gui.py -v
